<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12150f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<title>Crafting MC</title>
<style>
:root{--bg:#12150f;--card:#1c211a;--c2:#262d23;--tx:#eef2ea;--mu:#9aa593;--ac:#6fcf4a;--ac2:#27401f;--gold:#f5c542;--bd:#2d3629;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font:16px/1.4 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
.ab{display:none;align-items:center;gap:8px;height:56px;padding:0 8px 0 16px;background:var(--card);flex:none;z-index:2;border-bottom:1px solid var(--bd)}
#ttl{font-size:20px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{display:none;width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--tx);align-items:center;justify-content:center;font-size:24px}
#bk{margin-left:-10px}#fv{color:var(--gold)}.ib:active{background:var(--c2)}
.sb{padding:12px 16px 6px;position:relative;flex:none}
.sb svg{position:absolute;left:32px;top:26px;color:var(--mu)}
#q{width:100%;height:48px;padding:0 16px 0 46px;border:1px solid var(--bd);border-radius:24px;background:var(--card);color:var(--tx);font:inherit;outline:0}
#q:focus{border-color:var(--ac)}
main{flex:1;overflow-y:auto;padding:8px 16px 20px;overscroll-behavior:contain;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
@keyframes inn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main.in{animation:inn .22s ease-out}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.mu{color:var(--mu);font-size:14px}
.sec{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:18px 0 10px}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:22px 18px 30px;margin-bottom:6px;background:linear-gradient(135deg,#2f6b1b,#173d12 62%,#0f240c)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(90deg,#5aa63a 0 8px,#4c9a2a 8px 16px)}
.ht{font-size:26px;font-weight:800;line-height:1.1}.hh{opacity:.8;font-size:14px;margin-top:4px;max-width:60%}
.hi{position:absolute;right:12px;bottom:18px;display:flex;gap:2px}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px;border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);font:inherit;font-size:12px}
.hz{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.tile{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;font-size:11px;text-align:center}
.li{display:flex;align-items:center;gap:14px;width:100%;padding:8px 10px;margin-bottom:6px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;text-align:left}
.li span{flex:1}.li svg{color:var(--mu);flex:none}
.li:active,.cat:active,.tile:active,.chip:active,.btn:active{background:var(--c2)}
.fc{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px;scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;margin:0 6px 8px 0;padding:7px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font:inherit;font-size:14px;white-space:nowrap}
.fc .chip{margin:0}.chip.sel{background:var(--ac);color:#0d1a08;border-color:var(--ac);font-weight:700}
.btn{display:inline-block;text-decoration:none;border:0;border-radius:22px;padding:11px 20px;font:inherit;font-weight:600;background:var(--ac2);color:var(--ac);margin:0 8px 8px 0}
.dh{display:flex;align-items:center;gap:14px;margin:4px 0 14px}.dh h2{margin:0;font-size:24px;font-weight:700}
.tag{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:10px;background:var(--ac2);color:var(--ac);font-size:12px;font-weight:700}
.r{display:flex;align-items:center;gap:10px}
.st{width:44px;height:44px;border:1px solid var(--bd);border-radius:12px;background:var(--c2);color:var(--tx);font-size:22px}
input[type=number]{width:88px;height:44px;text-align:center;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:18px}
.mc{background:#c6c6c6;border:3px solid;border-color:#fff #555 #555 #fff;border-radius:4px;padding:12px;margin-bottom:12px;color:#373737}
.mt{font-size:13px;font-weight:700;margin-bottom:8px}
.mr{display:flex;align-items:center;gap:8px}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;flex:1;max-width:210px}
.ml{display:flex;flex-wrap:wrap;gap:2px;flex:1}.ml .sl{width:62px}
.sl{aspect-ratio:1;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1px;color:#161616;font:inherit;min-width:0;border-radius:0}
.sl span{font-size:8px;line-height:1;margin-top:1px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar{font-size:26px;color:#5a5a5a;flex:none}
.out{position:relative;flex:none;width:68px;height:68px;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737;display:flex;align-items:center;justify-content:center}
.out b{position:absolute;right:3px;bottom:0;font-size:15px;color:#fff;text-shadow:1px 1px #3f3f3f}
.mf{margin-top:8px;font-size:12px;color:#454545}
.px{image-rendering:pixelated;vertical-align:middle;flex:none}
.kv{display:flex;gap:10px;margin-top:8px;font-size:14px}.kv b{flex:none;width:74px;color:var(--ac)}.kv span{flex:1}
.gc{border-left:4px solid var(--ac)}.gc.Redstone{border-left-color:#e5483c}.gc.Utilità{border-left-color:#4aa3e8}
details{margin:0}summary{display:flex;align-items:center;gap:12px;list-style:none}
summary::-webkit-details-marker{display:none}summary::after{content:"▾";color:var(--mu)}details[open] summary::after{content:"▴"}
ol{margin:10px 0 0;padding-left:20px}li{margin-bottom:6px}
canvas{display:block;margin:10px 0 8px}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);flex:none;padding:8px 0 10px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;font-weight:600}
.pill{width:60px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:background .2s}
nav button.on{color:var(--tx)}nav button.on .pill{background:var(--ac2);color:var(--ac)}
</style></head>
